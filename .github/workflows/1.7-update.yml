name: MTA:SA Server 1.7 Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nightly version string to build and push"
        required: true
        type: string

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME_GHCR: ${{ github.repository }}
  IMAGE_NAME_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lowercase image names
        id: image
        run: |
          echo "ghcr=${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "dockerhub=${{ env.REGISTRY_DOCKERHUB }}/${{ env.IMAGE_NAME_DOCKERHUB }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Normalize public version tag
        id: version
        run: |
          raw_version='${{ inputs.version }}'
          normalized_version="v${raw_version#v}"
          normalized_version="${normalized_version%.*}"
          echo "public=${normalized_version}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MTA:SA Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ${{ steps.image.outputs.ghcr }}:${{ steps.version.outputs.public }}
            ${{ steps.image.outputs.dockerhub }}:${{ steps.version.outputs.public }}
